<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!-- Kein Verweis-Kopf beim Weiterklicken: Der Token steht im
     Adress-Fragment, und ohne diese Zeile könnte er über den
     Referer an eine fremde Seite gelangen. -->
<meta name="referrer" content="no-referrer">
<title>Ihre Auswahl bestätigen – Waschlurch</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
:root{
  --green:#22C55E; --green-dark:#15803D; --green-light:#DCFCE7;
  --black:#0A0A0A; --gray-900:#111827; --gray-500:#6B7280; --white:#FFFFFF;
  --weich:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--black); color:var(--white); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:24px 16px 40px; line-height:1.6;
}
a{color:var(--green)}

.kopf{width:100%;max-width:640px;margin-bottom:22px}
.marke{display:flex;align-items:center;gap:11px}
.marke img{height:34px;width:auto}
.marke-text{font-size:19px;font-weight:700}
.marke-sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:2px}

.karte{
  width:100%;max-width:640px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:28px;
}
.karte + .karte{margin-top:16px}

.titel{font-size:24px;font-weight:700;line-height:1.25;margin-bottom:8px}
.unter{font-size:15px;color:rgba(255,255,255,.62);margin-bottom:20px}

/* Eingaben nie unter 16px – darunter zoomt iOS beim Antippen hinein. */
textarea{
  width:100%;min-height:120px;padding:13px 15px;font-family:inherit;font-size:16px;
  line-height:1.6;color:var(--white);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);border-radius:14px;outline:none;resize:vertical;
}
textarea:focus{border-color:var(--green)}

.knopf{
  display:block;width:100%;padding:16px 22px;margin-top:12px;border:none;
  border-radius:100px;font-family:inherit;font-size:16px;font-weight:600;
  cursor:pointer;text-align:center;min-height:52px;transition:all .18s var(--weich);
}
.knopf-haupt{background:var(--green);color:var(--white)}
.knopf-haupt:hover{background:var(--green-dark)}
.knopf-still{background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.18)}
.knopf-still:hover{background:rgba(255,255,255,.06)}
.knopf:disabled{opacity:.5;cursor:not-allowed}

.daten{width:100%;border-collapse:collapse;margin:18px 0;table-layout:fixed}
.daten td{padding:11px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14.5px;vertical-align:top}
.daten tr:first-child td{border-top:none}
.daten td:first-child{color:rgba(255,255,255,.55);padding-right:14px;width:38%}
/* ⚠️ KEIN white-space:nowrap. Nachgemessen bei 320 px: Ein
   Firmenname wie „Hausverwaltung Rheinland-Sieg Immobilien GmbH &
   Co. KG" schob die Karte um 213 px über den Bildschirmrand
   hinaus. Beträge sind kurz genug, um auch ohne nowrap in einer
   Zeile zu bleiben. */
.daten td:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.daten td.lang{text-align:left;font-weight:400}

/* Der Betrag darf umbrechen – bei einer Preisspanne stehen dort
   zwei Beträge, und „11.588,60 € – 17.382,90 €" ist bei 29 px
   Schrift rund 290 px breit. */
.betrag{font-size:29px;font-weight:700;margin:6px 0 2px;overflow-wrap:anywhere;line-height:1.25}
.betrag-hinweis{font-size:13px;color:rgba(255,255,255,.5)}

.hinweis{
  padding:15px 17px;border-radius:15px;margin:18px 0;font-size:13.5px;line-height:1.65;
  background:rgba(250,204,21,.09);border:1px solid rgba(250,204,21,.28);color:#FDE047;
}
.hinweis-gruen{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#86EFAC}
.hinweis-rot{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.3);color:#FCA5A5}

.pos{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.pos td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.pos td:first-child{overflow-wrap:anywhere}
.pos .menge{text-align:right;color:rgba(255,255,255,.5);white-space:nowrap;padding-left:10px}
.pos .summe{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.pos-hinweis{font-size:12px;color:rgba(255,255,255,.42);margin-top:2px}

details{margin:16px 0}
summary{cursor:pointer;font-size:14px;color:rgba(255,255,255,.6);
        padding:12px 0;min-height:44px;display:flex;align-items:center}

/* Kenntnisnahmen. Keine ist vorangekreuzt – eine vorausgefüllte
   Zustimmung ist keine Zustimmung. Die Trefferfläche umfasst den
   ganzen Text, nicht nur das Kästchen. */
.zustimmungen{margin:20px 0 6px}
.zustimmung{
  display:flex;align-items:flex-start;gap:12px;padding:13px 0;
  min-height:44px;cursor:pointer;font-size:14px;line-height:1.6;
  color:rgba(255,255,255,.82);
}
.zustimmung + .zustimmung{border-top:1px solid rgba(255,255,255,.07)}
.zustimmung input[type="checkbox"]{
  width:24px;height:24px;flex-shrink:0;margin-top:1px;
  accent-color:var(--green);cursor:pointer;
}
.zustimmung span{min-width:0;overflow-wrap:anywhere}
.zustimmung a{color:var(--green)}

.laden{text-align:center;padding:50px 20px;color:rgba(255,255,255,.55)}
.punkt{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;
       background:var(--green);animation:huepf 1.3s infinite}
.punkt:nth-child(2){animation-delay:.16s}
.punkt:nth-child(3){animation-delay:.32s}
@keyframes huepf{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}

.fertig-zeichen{
  width:66px;height:66px;margin:0 auto 20px;border-radius:50%;
  background:rgba(34,197,94,.14);border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:31px;
}

.fuss{
  width:100%;max-width:640px;margin-top:26px;text-align:center;
  font-size:12.5px;color:rgba(255,255,255,.42);line-height:1.8;
}
.fuss a{color:rgba(255,255,255,.6);text-decoration:none}
.fuss a:hover{text-decoration:underline}

@media(max-width:560px){
  body{padding:18px 12px 32px}
  .karte{padding:20px;border-radius:19px}
  .titel{font-size:21px}
  .betrag{font-size:23px}
  /* Bei 320 px sprengt die Mengenspalte die Zeile, sobald ein
     Tausenderpunkt darin steht. Die Menge steht im Text ohnehin. */
  .pos .menge{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>

      <div class="marke-text">Waschlurch</div>
      <div class="marke-sub">Reinigung und Hausmeisterservice</div>

</div>

<div id="inhalt" class="karte">

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   KUNDENAKTIONSSEITE
   ══════════════════════════════════════════════════════════════
   Der Token steht im Adress-FRAGMENT (hinter #). Fragmente sendet
   der Browser nie an den Server – das Token landet damit in keiner
   Zugriffsliste, in keinem Verweis-Kopf und in keinem Protokoll
   eines Zwischenservers.

   Alles Verbindliche entscheidet der Server. Diese Seite zeigt nur
   an und fragt nach; sie prüft nichts selbst und darf das auch
   nicht – was hier stünde, könnte jeder im Entwicklerwerkzeug
   ändern.
   ══════════════════════════════════════════════════════════════ */

const inhalt = document.getElementById('inhalt');

/* Jeder Wert aus der Antwort läuft durch diese Funktion, bevor er
   in eine Vorlage kommt. Die Daten stammen zwar aus der eigenen
   Datenbank, aber dorthin gelangen sie über ein öffentlich
   absendbares Formular. */
function sicher(w){
  return String(w == null ? '' : w)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function euro(cent){
  return ((Number(cent)||0)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
}
function datum(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});
}

function fragment(){
  const roh = (location.hash || '').replace(/^#/,'');
  const werte = new URLSearchParams(roh);
  return { token: werte.get('t') || '', aktion: werte.get('a') || '' };
}

async function server(nutzlast){
  const antwort = await fetch('/api/aktion', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(nutzlast),
  });
  if(antwort.status === 404) throw new Error('EINRICHTUNG_FEHLT');
  return antwort.json();
}

function zeigeFehler(text, ueberschrift){
  inhalt.innerHTML =
    '<div class="titel">' + sicher(ueberschrift || 'Das hat nicht geklappt') + '</div>' +
    '<div class="hinweis hinweis-rot">' + sicher(text) + '</div>' +
    '<p style="font-size:14px;color:rgba(255,255,255,.6);margin-top:16px">' +
    'Schreiben Sie uns gern kurz an <a href="mailto:waschlurch@gmail.com">waschlurch@gmail.com</a> – ' +
    'wir kümmern uns darum.</p>';
}

/* ── Schritt 1: Übersicht mit Bestätigungsknopf ────────────── */
function zeigeUebersicht(antwort, token, aktion){
  const d = antwort.dokument || {};

  const betragBlock = d.spanne
    ? '<div class="betrag">' + sicher(euro(d.spanne.von_cent)) + ' – ' + sicher(euro(d.spanne.bis_cent)) + '</div>' +
      '<div class="betrag-hinweis">voraussichtlich, inkl. Umsatzsteuer</div>'
    : '<div class="betrag">' + sicher(euro(d.brutto_gesamt_cent)) + '</div>' +
      '<div class="betrag-hinweis">' + (d.mwst_satz > 0 ? 'inkl. ' + sicher(String(d.mwst_satz).replace('.',',')) + ' % Umsatzsteuer' : 'ohne Umsatzsteuer (§ 19 UStG)') + '</div>';

  const positionen = (d.positionen || []).map(function(p){
    return '<tr><td>' + sicher(p.text) +
      (p.hinweis ? '<div class="pos-hinweis">' + sicher(p.hinweis) + '</div>' : '') +
      '</td><td class="menge">' + sicher(p.menge || '') +
      '</td><td class="summe">' + sicher(euro(p.betrag_cent)) + '</td></tr>';
  }).join('');

  const annahmen = (d.annahmen || []).length
    ? '<details><summary>Worauf diese Kalkulation beruht</summary><ul style="margin:8px 0 0 18px;font-size:13.5px;color:rgba(255,255,255,.6)">' +
      d.annahmen.map(function(a){ return '<li style="margin-bottom:5px">' + sicher(a) + '</li>'; }).join('') +
      '</ul></details>'
    : '';

  const textfeld = antwort.textfeld === 'nein' ? '' :
    '<div style="margin-top:20px">' +
    '<label for="nachricht" style="display:block;font-size:14px;margin-bottom:8px;color:rgba(255,255,255,.7)">' +
    sicher(antwort.textfeld === 'pflicht' ? 'Ihre Nachricht' : 'Möchten Sie uns etwas mitteilen? (freiwillig)') +
    '</label><textarea id="nachricht" placeholder="' +
    sicher(antwort.textfeld === 'pflicht' ? 'Bitte kurz beschreiben ...' : 'Optional ...') + '"></textarea></div>';

  inhalt.innerHTML =
    '<div class="titel">' + sicher(antwort.titel) + '</div>' +
    '<div class="unter">Bitte prüfen Sie kurz, worum es geht. Erst mit dem Knopf unten wird Ihre Auswahl wirksam.</div>' +

    '<table class="daten">' +
      '<tr><td>Vorgang</td><td>' + sicher(d.nummer) + ' · Fassung ' + sicher(d.version) + '</td></tr>' +
      (d.name || d.firma ? '<tr><td>Für</td><td class="lang">' + sicher(d.firma || d.name) + '</td></tr>' : '') +
      (d.leistungen ? '<tr><td>Leistungen</td><td class="lang">' + sicher(d.leistungen) + '</td></tr>' : '') +
      (d.reserved_until ? '<tr><td>Vorgemerkt bis</td><td>' + sicher(datum(d.reserved_until)) + '</td></tr>' : '') +
    '</table>' +

    betragBlock +

    (positionen ? '<details><summary>Einzelne Posten anzeigen</summary><table class="pos"><tbody>' + positionen + '</tbody></table></details>' : '') +
    annahmen +

    '<div class="hinweis">Diese Vorabkalkulation ist <strong>unverbindlich</strong> und stellt kein ' +
    'verbindliches Angebot dar. Ein Vertrag kommt dadurch nicht zustande. Ein verbindliches Angebot ' +
    'erhalten Sie erst nach Prüfung beziehungsweise Besprechung.</div>' +

    (d.besichtigung_noetig
      ? '<div class="hinweis">Wegen des Umfangs sehen wir vor einem verbindlichen Angebot eine kurze Besichtigung vor.</div>'
      : '') +

    '<div style="margin-top:20px;font-size:14.5px;color:rgba(255,255,255,.72)">' + sicher(antwort.frage) + '</div>' +
    textfeld +

    '<button class="knopf knopf-haupt" id="bestaetigen">' + sicher(antwort.titel) + ' – jetzt bestätigen</button>' +
    '<button class="knopf knopf-still" id="abbrechen">Doch nicht – Fenster schließen</button>';

  document.getElementById('abbrechen').onclick = function(){
    inhalt.innerHTML = '<div class="titel">Alles unverändert</div>' +
      '<div class="unter">Es wurde nichts geändert. Sie können dieses Fenster schließen ' +
      'und den Link später erneut aufrufen.</div>';
  };

  document.getElementById('bestaetigen').onclick = async function(){
    const knopf = this;
    const feld = document.getElementById('nachricht');
    const nachricht = feld ? feld.value.trim() : '';

    if(antwort.textfeld === 'pflicht' && !nachricht){
      if(feld){ feld.style.borderColor = '#F87171'; feld.focus(); }
      return;
    }

    /* Gegen den Doppelklick: Der Server fängt ihn ohnehin ab, aber
       eine Schaltfläche, die sich zweimal drücken lässt, sieht aus
       wie ein Fehler. */
    knopf.disabled = true;
    knopf.textContent = 'Wird gesendet ...';
    document.getElementById('abbrechen').disabled = true;

    try {
      const ergebnis = await server({ token: token, aktion: aktion, schritt:'bestaetigen', nachricht: nachricht });
      if(ergebnis.ok) zeigeFertig(ergebnis);
      else if(ergebnis.bereits_bestaetigt) zeigeBereitsBestaetigt(ergebnis);
      else {
        zeigeFehler(ergebnis.text || ergebnis.fehler || 'Das hat nicht geklappt.');
      }
    } catch(err){
      if(err.message === 'EINRICHTUNG_FEHLT'){
        zeigeFehler('Diese Funktion ist noch nicht freigeschaltet. Bitte antworten Sie einfach auf unsere E-Mail.');
      } else {
        knopf.disabled = false;
        knopf.textContent = antwort.titel + ' – jetzt bestätigen';
        document.getElementById('abbrechen').disabled = false;
        zeigeFehler('Die Verbindung hat nicht geklappt. Bitte versuchen Sie es in einem Moment erneut.');
      }
    }
  };
}

/* ══════════════════════════════════════════════════════════════
   VERBINDLICHES ANGEBOT – Zusammenfassung vor der Bestellung
   ══════════════════════════════════════════════════════════════
   § 312j Abs. 3 BGB: Unmittelbar vor der Bestellung müssen die
   wesentlichen Angaben noch einmal stehen, und die Schaltfläche
   muss ausdrücklich auf die Zahlungspflicht hinweisen. Deshalb
   „Zahlungspflichtig bestellen" und nicht „Absenden".

   Keine Kenntnisnahme ist vorangekreuzt – eine vorausgefüllte
   Zustimmung ist keine.
   ══════════════════════════════════════════════════════════════ */
function zeigeAngebotZusammenfassung(antwort, token, aktion){
  const d = antwort.dokument || {};
  const r = antwort.rechtstexte;

  const positionen = (d.positionen || []).map(function(p){
    return '<tr><td>' + sicher(p.text) +
      (p.hinweis ? '<div class="pos-hinweis">' + sicher(p.hinweis) + '</div>' : '') +
      '</td><td class="menge">' + sicher(p.menge || '') +
      '</td><td class="summe">' + sicher(euro(p.betrag_cent)) + '</td></tr>';
  }).join('');

  const rechtsBlock = d.verbraucher && r ?
    '<details><summary>Widerrufsbelehrung und Muster-Widerrufsformular</summary>' +
    '<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,.72);margin-top:8px">' +
    sicher(r.widerruf) + '<br><br><strong>Muster-Widerrufsformular</strong><br>' + sicher(r.formular) +
    '</div></details>' : '';

  const kenntnisnahmen =
    '<label class="zustimmung"><input type="checkbox" id="agb"> ' +
    '<span>Ich habe die <a href="/agb.html" target="_blank" rel="noopener">AGB</a>' +
    (d.agb_version ? ' (' + sicher(d.agb_version) + ')' : '') +
    ' und die <a href="/datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a> ' +
    'zur Kenntnis genommen.</span></label>' +
    (d.verbraucher ?
      '<label class="zustimmung"><input type="checkbox" id="widerruf"> ' +
      '<span>Ich habe die Widerrufsbelehrung und das Muster-Widerrufsformular erhalten ' +
      'und zur Kenntnis genommen.</span></label>' +
      '<label class="zustimmung"><input type="checkbox" id="vorzeitig"> ' +
      '<span><strong>Freiwillig:</strong> ' + sicher(r ? r.vorzeitig : '') + '</span></label>'
      : '');

  inhalt.innerHTML =
    '<div class="titel">Bestellung prüfen</div>' +
    '<div class="unter">Bitte prüfen Sie alle Angaben. Mit dem Knopf am Ende geben Sie eine ' +
    '<strong>verbindliche, zahlungspflichtige Bestellung</strong> ab.</div>' +

    '<table class="daten">' +
      '<tr><td>Anbieter</td><td class="lang">' + sicher(d.anbieter) + '</td></tr>' +
      '<tr><td>Kunde</td><td class="lang">' + sicher(d.firma || d.name) + '</td></tr>' +
      (d.anschrift ? '<tr><td>Anschrift</td><td class="lang">' + sicher(d.anschrift) + '</td></tr>' : '') +
      '<tr><td>Angebot</td><td>' + sicher(d.nummer) + ' · Fassung ' + sicher(d.version) + '</td></tr>' +
      '<tr><td>Leistung</td><td class="lang">' + sicher(d.leistungen || '–') + '</td></tr>' +
      (d.ausfuehrung_zeitraum ? '<tr><td>Ausführung</td><td class="lang">' + sicher(d.ausfuehrung_zeitraum) + '</td></tr>' : '') +
      (d.ausgeschlossen ? '<tr><td>Nicht enthalten</td><td class="lang">' + sicher(d.ausgeschlossen) + '</td></tr>' : '') +
      '<tr><td>Zahlung</td><td class="lang">' + sicher(d.zahlungsbedingungen || '–') + '</td></tr>' +
      '<tr><td>Gültig bis</td><td>' + sicher(datum(d.gueltig_bis)) + '</td></tr>' +
    '</table>' +

    (positionen ? '<table class="pos"><tbody>' + positionen + '</tbody></table>' : '') +

    '<table class="daten" style="margin-top:14px">' +
      '<tr><td>Nettobetrag</td><td>' + sicher(euro(d.netto_gesamt_cent)) + '</td></tr>' +
      (d.mwst_satz > 0
        ? '<tr><td>zzgl. ' + sicher(String(d.mwst_satz).replace('.',',')) + ' % USt.</td><td>' + sicher(euro(d.mwst_cent)) + '</td></tr>'
        : '<tr><td colspan="2" style="text-align:left;font-weight:400;color:rgba(255,255,255,.55)">Ohne Umsatzsteuer nach § 19 UStG</td></tr>') +
    '</table>' +
    '<div class="betrag">' + sicher(euro(d.brutto_gesamt_cent)) + '</div>' +
    '<div class="betrag-hinweis">Gesamtbetrag' + (d.mwst_satz > 0 ? ' inkl. Umsatzsteuer' : '') + '</div>' +

    rechtsBlock +
    '<div class="zustimmungen">' + kenntnisnahmen + '</div>' +
    '<div id="zustimmung-fehler" class="hinweis hinweis-rot" style="display:none"></div>' +

    '<button class="knopf knopf-haupt" id="bestellen">Zahlungspflichtig bestellen</button>' +
    '<button class="knopf knopf-still" id="abbrechen">Doch nicht – Fenster schließen</button>' +
    '<div style="margin-top:14px;font-size:12.5px;color:rgba(255,255,255,.45);text-align:center">' +
    'Mit dem Klick auf „Zahlungspflichtig bestellen" schließen Sie einen kostenpflichtigen Vertrag.</div>';

  document.getElementById('abbrechen').onclick = function(){
    inhalt.innerHTML = '<div class="titel">Nichts bestellt</div>' +
      '<div class="unter">Es wurde nichts beauftragt. Das Angebot bleibt bis zum ' +
      sicher(datum(d.gueltig_bis)) + ' gültig – Sie können den Link jederzeit erneut öffnen.</div>';
  };

  document.getElementById('bestellen').onclick = async function(){
    const knopf = this;
    const fehlerBox = document.getElementById('zustimmung-fehler');
    const agb = document.getElementById('agb');
    const widerruf = document.getElementById('widerruf');
    const vorzeitig = document.getElementById('vorzeitig');

    const fehlend = [];
    if(!agb.checked) fehlend.push('die Kenntnisnahme der AGB');
    if(d.verbraucher && widerruf && !widerruf.checked) fehlend.push('die Kenntnisnahme der Widerrufsbelehrung');
    if(fehlend.length){
      fehlerBox.textContent = 'Bitte bestätigen Sie noch ' + fehlend.join(' und ') + '.';
      fehlerBox.style.display = 'block';
      fehlerBox.scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    fehlerBox.style.display = 'none';

    knopf.disabled = true;
    knopf.textContent = 'Bestellung wird übermittelt ...';
    document.getElementById('abbrechen').disabled = true;

    try {
      const ergebnis = await server({
        token: token, aktion: aktion, schritt:'bestaetigen',
        agb_gelesen: true,
        widerruf_gelesen: d.verbraucher ? true : undefined,
        vorzeitiger_beginn: !!(vorzeitig && vorzeitig.checked),
      });
      if(ergebnis.ok) zeigeFertig(ergebnis);
      else if(ergebnis.bereits_bestaetigt) zeigeBereitsBestaetigt(ergebnis);
      else {
        knopf.disabled = false;
        knopf.textContent = 'Zahlungspflichtig bestellen';
        document.getElementById('abbrechen').disabled = false;
        fehlerBox.textContent = ergebnis.text || ergebnis.fehler || 'Das hat nicht geklappt.';
        fehlerBox.style.display = 'block';
      }
    } catch(err){
      knopf.disabled = false;
      knopf.textContent = 'Zahlungspflichtig bestellen';
      document.getElementById('abbrechen').disabled = false;
      fehlerBox.textContent = 'Die Verbindung hat nicht geklappt. Es wurde nichts bestellt. ' +
                              'Bitte versuchen Sie es in einem Moment erneut.';
      fehlerBox.style.display = 'block';
    }
  };
}

/* ── Schritt 2: Rückmeldung ───────────────────────────────────
   Zeigt ausdrücklich, WAS gebucht wurde: Aktion, Vorgangsnummer und
   – bei einer Vormerkung – bis wann. Der Kunde soll einen Beleg vor
   Augen haben, nicht nur ein „danke".

   Bewusst KEINE Beträge, Positionen oder Kalkulationsdaten. Die
   stehen im PDF, das er bereits hat. */
function zeigeFertig(ergebnis){
  const zeilen = [];
  if(ergebnis.titel)  zeilen.push(['Ihre Auswahl', ergebnis.titel]);
  if(ergebnis.nummer) zeilen.push(['Vorgang', ergebnis.nummer]);
  if(ergebnis.vorgemerkt_bis) zeilen.push(['Vorgemerkt bis', datum(ergebnis.vorgemerkt_bis)]);

  const tabelle = zeilen.length
    ? '<table class="daten">' + zeilen.map(function(z){
        return '<tr><td>' + sicher(z[0]) + '</td><td class="lang">' + sicher(z[1]) + '</td></tr>';
      }).join('') + '</table>'
    : '';

  inhalt.innerHTML =
    '<div class="fertig-zeichen">✓</div>' +
    '<div class="titel" style="text-align:center">Vielen Dank</div>' +
    '<div class="unter" style="text-align:center">' + sicher(ergebnis.text || 'Ihre Rückmeldung ist bei uns angekommen.') + '</div>' +
    tabelle +
    '<div class="hinweis hinweis-gruen">Sie erhalten gleich eine Bestätigung per E-Mail. ' +
    (ergebnis.aktion === 'vormerken'
      ? 'Durch die Vormerkung entsteht noch kein Vertrag, und es wird kein Ausführungstermin verbindlich reserviert.'
      : ergebnis.aktion === 'beauftragen'
        ? 'Den Ausführungstermin stimmen wir kurzfristig mit Ihnen ab.'
        : 'Wir melden uns zeitnah bei Ihnen.') + '</div>';
  history.replaceState(null, '', location.pathname);   // Token aus der Adresszeile nehmen
}

/* ── Bereits bestätigt ────────────────────────────────────────
   Kein Fehlerzustand: Der Kunde hat schon geklickt und ruft den
   Link erneut auf. Ruhige Auskunft statt roter Meldung. */
function zeigeBereitsBestaetigt(ergebnis){
  const zeilen = [];
  if(ergebnis.titel)  zeilen.push(['Ihre Auswahl', ergebnis.titel]);
  if(ergebnis.nummer) zeilen.push(['Vorgang', ergebnis.nummer]);
  if(ergebnis.vorgemerkt_bis) zeilen.push(['Vorgemerkt bis', datum(ergebnis.vorgemerkt_bis)]);
  if(ergebnis.bestaetigt_am) zeilen.push(['Bestätigt am', datum(ergebnis.bestaetigt_am)]);

  inhalt.innerHTML =
    '<div class="fertig-zeichen">✓</div>' +
    '<div class="titel" style="text-align:center">Diese Auswahl wurde bereits bestätigt</div>' +
    '<div class="unter" style="text-align:center">Es ist alles erledigt – Sie müssen nichts weiter tun.</div>' +
    (zeilen.length
      ? '<table class="daten">' + zeilen.map(function(z){
          return '<tr><td>' + sicher(z[0]) + '</td><td class="lang">' + sicher(z[1]) + '</td></tr>';
        }).join('') + '</table>'
      : '') +
    '<div class="hinweis hinweis-gruen">Die Bestätigung haben wir Ihnen bereits per E-Mail geschickt. ' +
    'Bei Fragen erreichen Sie uns unter <a href="mailto:waschlurch@gmail.com">waschlurch@gmail.com</a>.</div>';
  history.replaceState(null, '', location.pathname);
}

/* ── Start ──────────────────────────────────────────────────── */
(async function(){
  const { token, aktion } = fragment();

  if(!token || !aktion){
    zeigeFehler('Dieser Link ist unvollständig. Bitte öffnen Sie ihn noch einmal direkt aus unserer E-Mail heraus.',
                'Link unvollständig');
    return;
  }

  try {
    const antwort = await server({ token: token, aktion: aktion, schritt:'ansehen' });
    if(!antwort.ok){
      /* Bereits bestätigt ist kein Fehler – das ist der Normalfall,
         wenn jemand den Link ein zweites Mal öffnet. */
      if(antwort.bereits_bestaetigt){ zeigeBereitsBestaetigt(antwort); return; }

      const ueberschriften = {
        abgelaufen:'Dieser Link ist abgelaufen',
        veraltet:'Es gibt eine neuere Fassung',
        widerrufen:'Dieser Link wurde zurückgezogen',
      };
      zeigeFehler(antwort.text || antwort.fehler || 'Dieser Link ist nicht gültig.',
                  ueberschriften[antwort.grund]);
      return;
    }
    /* Die zahlungspflichtige Beauftragung bekommt die
       Zusammenfassungsseite, alles andere die einfache Übersicht. */
    if(antwort.zweistufig) zeigeAngebotZusammenfassung(antwort, token, aktion);
    else zeigeUebersicht(antwort, token, aktion);
  } catch(err){
    if(err.message === 'EINRICHTUNG_FEHLT'){
      zeigeFehler('Diese Funktion ist noch nicht freigeschaltet. Bitte antworten Sie einfach auf unsere E-Mail.',
                  'Noch nicht verfügbar');
    } else {
      zeigeFehler('Die Verbindung hat nicht geklappt. Bitte laden Sie die Seite neu.');
    }
  }
})();
</script>
